<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Curator 연결</title>
<link rel="stylesheet" href="popup.css"></head><body>
<h1>Curator 연결</h1>
<p>Target 탭에서 실행하세요. 앱의 2단계에서 받은 연결 코드를 입력합니다.</p>
<label for="code">일회용 연결 코드 (2분)</label>
<input id="code" maxlength="32" autocomplete="off" spellcheck="false">
<button id="pair">프로젝트 연결</button>
<button id="bind">이 탭 사용 / 캡처 준비</button>
<button id="disconnect">연결 해제</button>
<p id="status" role="status" aria-live="polite"></p>
<small>로컬 서버: 127.0.0.1:8787<br>Target 로그인·쿠키를 전달하지 않습니다. 담기를 눌러 선택한 이미지 영역과 상품 URL만 저장합니다. 새 탭에서는 이 아이콘을 다시 눌러 캡처를 허용하세요.</small>
<script src="popup.js"></script></body></html>
